<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>連線統計</title>
<!-- Louisa Wi-Fi 的連線統計，仿 Mac 版 StatsView。LouisaWiFi.ps1 會把 usage.json 塞進下面的 USAGE。 -->
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --tile: #f4f4f2; --line: #e5e5e2;
    --accent: #2a78d6; --accent-soft: rgba(42, 120, 214, .14);
    --l0: #f0efec; --l1: #b7d3f6; --l2: #6da7ec; --l3: #2a78d6; --l4: #104281; --bar: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --fg: #f2f2f2; --muted: #9a9a9f; --tile: #2a2a2a; --line: #3a3a3a;
      --accent: #3987e5; --accent-soft: rgba(57, 135, 229, .22);
      --l0: #383835; --l1: #184f95; --l2: #256abf; --l3: #3987e5; --l4: #86b6ef; --bar: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 "Microsoft JhengHei UI", "Microsoft JhengHei", "Segoe UI", sans-serif;
  }
  .wrap { display: flex; gap: 24px; align-items: flex-start; padding: 28px 16px; max-width: 900px; margin: 0 auto; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
  .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 19px; margin: 0; font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .small { font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--tile); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { background: var(--tile); border-radius: 8px; padding: 12px; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  /* 一整年剛好塞滿寬度：格子大小跟著頁面縮放，不需要左右捲動 */
  .grid { display: grid; grid-template-columns: 18px repeat(var(--weeks), minmax(0, 1fr)); gap: 3px; width: 100%; }
  .grid .mon { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: visible; height: 16px; line-height: 16px; }
  .grid .day { font-size: 10px; color: var(--muted); align-self: center; }
  .cell { width: 100%; aspect-ratio: 1; border-radius: 2px; background: var(--l0); border: 0; padding: 0; display: block; }
  .cell.hidden { visibility: hidden; }
  .cell.future { opacity: .35; cursor: default; }
  .cell.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
  .legend { display: flex; align-items: center; gap: 3px; justify-content: flex-end; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  .caption { margin-top: 8px; min-height: 21px; }
  .caption .hint { color: var(--muted); }
  .seg { display: inline-flex; background: var(--tile); border-radius: 7px; padding: 2px; }
  .seg button { border: 0; background: none; padding: 4px 16px; border-radius: 5px; }
  .seg button.on { background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .bars { max-height: 190px; overflow-y: auto; margin-top: 12px; }
  .row { display: grid; grid-template-columns: 140px 1fr 100px; gap: 10px; align-items: center;
         padding: 5px 8px; border-radius: 6px; cursor: pointer; width: 100%; border: 0; background: none; text-align: left; }
  .row:hover { background: var(--tile); }
  .row.on { background: var(--accent-soft); }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .bar { height: 14px; border-radius: 3px; background: var(--bar); min-width: 2px; }
  .row .t { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .mcols { display: grid; grid-template-columns: repeat(12, 1fr); align-items: end; height: 150px; margin-top: 12px; }
  .mcol { display: flex; flex-direction: column; align-items: center; gap: 6px; justify-content: flex-end; height: 100%; }
  .mcol .peak { font-size: 11px; color: var(--muted); white-space: nowrap; min-height: 16px; }
  .mcol .b { width: 28px; max-width: 80%; border-radius: 3px; background: var(--bar); }
  .mcol .b.zero { background: var(--l0); }
  .mcol .lbl { font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); margin-top: 12px; }
  aside { display: flex; flex-direction: column; gap: 4px; padding-top: 2px; }
  aside button { border: 0; background: none; text-align: left; width: 96px; padding: 6px 10px; border-radius: 6px; }
  aside button.on { background: var(--accent); color: #fff; }
  .foot { font-size: 12px; color: var(--muted); }
  @media (max-width: 640px) {
    .wrap { flex-direction: column-reverse; padding: 20px 16px; }
    aside { flex-direction: row; flex-wrap: wrap; }
    aside button { width: auto; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .row { grid-template-columns: 100px 1fr 84px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <main>
    <div class="head"><h1 id="title"></h1><button id="clear" class="small" hidden>顯示全部門市</button></div>
    <div class="tiles" id="tiles"></div>
    <div>
      <div class="grid" id="grid"></div>
      <div class="legend">少 <i style="background:var(--l0)"></i><i style="background:var(--l1)"></i><i style="background:var(--l2)"></i><i style="background:var(--l3)"></i><i style="background:var(--l4)"></i> 多</div>
      <div class="caption" id="caption"></div>
    </div>
    <div>
      <div class="seg" id="seg"></div>
      <div id="breakdown"></div>
    </div>
    <div class="foot">資料只存在這台電腦：%APPDATA%\LouisaWiFi\usage.json。連上路易莎 Wi-Fi 時每分鐘記一次，電腦睡眠的時間不算。</div>
  </main>
  <aside id="years"></aside>
</div>
<script>
const USAGE = /*__USAGE__*/{};
const UNKNOWN = '未知門市';
const DAY = 86400000;

const state = { range: 'past', store: null, breakdown: 'stores', selected: null };

const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const monday = d => addDays(d, -((d.getDay() + 6) % 7));
const weekday = d => '星期' + '日一二三四五六'[d.getDay()];
const dayLabel = d => `${d.getMonth() + 1}月${d.getDate()}日`;
function duration(s) {
  const m = Math.floor(s / 60);
  return m >= 60 ? `${Math.floor(m / 60)} 小時 ${m % 60} 分` : `${m} 分`;
}
function level(s) {
  if (s < 1) return 'var(--l0)';
  if (s < 1800) return 'var(--l1)';
  if (s < 3600) return 'var(--l2)';
  if (s < 7200) return 'var(--l3)';
  return 'var(--l4)';
}
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function period(range) {
  const today = startOfDay(new Date());
  let first, end;
  if (range === 'past') { first = addDays(today, -364); end = today; }
  else { first = new Date(range, 0, 1); end = new Date(range, 11, 31); }
  const last = end < today ? end : today;
  const gridStart = monday(first);
  const weeks = Math.round((monday(end) - gridStart) / DAY / 7) + 1;
  const days = [];
  for (let d = first; d <= last; d = addDays(d, 1)) days.push(d);
  return { first, end, last, gridStart, weeks, days };
}

function perDay() {
  const out = {};
  for (const [k, stores] of Object.entries(USAGE)) {
    out[k] = state.store ? (stores[state.store] || 0) : Object.values(stores).reduce((a, b) => a + b, 0);
  }
  return out;
}

function storeTotals(p) {
  const t = {};
  for (const d of p.days) for (const [n, s] of Object.entries(USAGE[key(d)] || {})) t[n] = (t[n] || 0) + s;
  return Object.entries(t).map(([name, seconds]) => ({ name, seconds })).sort((a, b) => b.seconds - a.seconds);
}

function monthTotals(p, pd) {
  const out = [];
  for (let back = 11; back >= 0; back--) {
    const m = new Date(p.end.getFullYear(), p.end.getMonth() - back, 1);
    const prefix = `${m.getFullYear()}-${pad(m.getMonth() + 1)}`;
    let s = 0;
    for (const [k, v] of Object.entries(pd)) if (k.startsWith(prefix)) s += v;
    out.push({ label: `${m.getMonth() + 1}月`, seconds: s });
  }
  return out;
}

function yearTotals(pd) {
  const t = {};
  for (const [k, s] of Object.entries(pd)) if (s > 0) { const y = +k.slice(0, 4); t[y] = (t[y] || 0) + s; }
  return Object.entries(t).map(([y, seconds]) => ({ year: +y, seconds })).sort((a, b) => b.year - a.year);
}

function longestStreak(days) {
  let best = 0, run = 0;
  for (const s of days) { run = s > 0 ? run + 1 : 0; best = Math.max(best, run); }
  return best;
}

function render() {
  const p = period(state.range);
  const pd = perDay();
  const days = p.days.map(d => pd[key(d)] || 0);
  const total = days.reduce((a, b) => a + b, 0);
  const visits = days.filter(s => s > 0).length;
  const stores = storeTotals(p);
  const heading = state.range === 'past' ? '過去一年' : `${state.range} 年`;

  document.getElementById('title').textContent = `${state.store ? state.store + '：' : ''}${heading}累計連線 ${duration(total)}`;
  document.getElementById('clear').hidden = !state.store;

  const tiles = document.getElementById('tiles');
  tiles.replaceChildren(...[
    ['到訪天數', `${visits} 天`],
    ['到訪門市', `${stores.filter(s => s.name !== UNKNOWN).length} 家`],
    ['最長連續', `${longestStreak(days)} 天`],
    ['平均每天', visits > 0 ? duration(total / visits) : '—'],
  ].map(([k, v]) => { const t = el('div', 'tile'); t.append(el('div', 'k', k), el('div', 'v', v)); return t; }));

  renderGrid(p, pd);
  renderCaption();
  renderBreakdown(p, pd, stores);
  renderYears();
}

// 一個 CSS grid：第一列是月份，下面 7 列是星期一到日；第一欄是星期名稱，之後每欄一週
function renderGrid(p, pd) {
  const grid = document.getElementById('grid');
  grid.style.setProperty('--weeks', p.weeks);
  const today = startOfDay(new Date());
  const out = [el('span')];
  for (let w = 0; w < p.weeks; w++) {
    let label = '';
    for (let r = 0; r < 7; r++) {
      const d = addDays(p.gridStart, w * 7 + r);
      if (d.getDate() === 1 && d >= p.first && d <= p.end) label = `${d.getMonth() + 1}月`;
    }
    out.push(el('span', 'mon', label));
  }
  const dayNames = ['一', '', '三', '', '五', '', ''];
  for (let r = 0; r < 7; r++) {
    out.push(el('span', 'day', dayNames[r]));
    for (let w = 0; w < p.weeks; w++) {
      const d = addDays(p.gridStart, w * 7 + r);
      const c = el('button', 'cell');
      if (d < p.first || d > p.end) c.classList.add('hidden');
      else if (d > today) c.classList.add('future');
      else {
        const k = key(d), s = pd[k] || 0;
        c.style.background = level(s);
        c.title = `${dayLabel(d)}（${weekday(d)}）${s > 0 ? '：' + duration(s) : '：無紀錄'}`;
        if (state.selected === k) c.classList.add('sel');
        c.onclick = () => { state.selected = state.selected === k ? null : k; render(); };
      }
      out.push(c);
    }
  }
  grid.replaceChildren(...out);
}

function renderCaption() {
  const cap = document.getElementById('caption');
  if (!state.selected) { cap.replaceChildren(el('span', 'hint', '點選格子，查看當天的門市與連線時間')); return; }
  const [y, m, d] = state.selected.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const stores = Object.entries(USAGE[state.selected] || {}).filter(([, s]) => s > 0).sort((a, b) => b[1] - a[1]);
  const b = el('strong', null, `${dayLabel(date)}（${weekday(date)}）`);
  const detail = stores.length ? stores.map(([n, s]) => `${n} ${duration(s)}`).join('・') : '無紀錄';
  cap.replaceChildren(b, document.createTextNode('　' + detail));
}

function renderBreakdown(p, pd, stores) {
  const seg = document.getElementById('seg');
  seg.replaceChildren(...[['stores', '門市'], ['months', '月份'], ['years', '年份']].map(([id, label]) => {
    const btn = el('button', state.breakdown === id ? 'on' : '', label);
    btn.onclick = () => { state.breakdown = id; render(); };
    return btn;
  }));

  const box = document.getElementById('breakdown');
  if (state.breakdown === 'months') {
    const months = monthTotals(p, pd);
    const peak = Math.max(0, ...months.map(m => m.seconds));
    const wrap = el('div', 'mcols');
    for (const m of months) {
      const c = el('div', 'mcol');
      c.title = `${m.label}：${m.seconds > 0 ? duration(m.seconds) : '無紀錄'}`;
      c.append(el('div', 'peak', m.seconds === peak && peak > 0 ? duration(m.seconds) : ''));
      const b = el('div', 'b' + (m.seconds > 0 ? '' : ' zero'));
      b.style.height = (peak > 0 ? Math.max(2, 110 * m.seconds / peak) : 2) + 'px';
      c.append(b, el('div', 'lbl', m.label));
      wrap.append(c);
    }
    box.replaceChildren(wrap);
    return;
  }
  const isYears = state.breakdown === 'years';
  const rows = isYears
    ? yearTotals(pd).map(y => ({ id: String(y.year), label: `${y.year} 年`, seconds: y.seconds }))
    : stores.map(s => ({ id: s.name, label: s.name, seconds: s.seconds }));
  if (!rows.length) {
    box.replaceChildren(el('div', 'empty', isYears ? '還沒有紀錄。' : '這段期間沒有紀錄。連上路易莎 Wi-Fi 後會自動計時。'));
    return;
  }
  const selected = isYears ? (state.range === 'past' ? null : String(state.range)) : state.store;
  const list = el('div', 'bars');
  for (const r of rows) {
    const row = el('button', 'row' + (selected === r.id ? ' on' : ''));
    const track = el('div');
    const bar = el('div', 'bar');
    bar.style.width = (100 * r.seconds / rows[0].seconds) + '%';
    track.append(bar);
    const name = el('span', 'name', r.label);
    name.title = r.label;
    row.append(name, track, el('span', 't', duration(r.seconds)));
    row.onclick = () => {
      if (isYears) state.range = +r.id;
      else state.store = state.store === r.id ? null : r.id;
      state.selected = null;
      render();
    };
    list.append(row);
  }
  box.replaceChildren(list);
}

function renderYears() {
  const current = new Date().getFullYear();
  const years = [...new Set([...Object.keys(USAGE).map(k => +k.slice(0, 4)), current])].sort((a, b) => b - a);
  const aside = document.getElementById('years');
  aside.replaceChildren(...['past', ...years].map(r => {
    const b = el('button', state.range === r ? 'on' : '', r === 'past' ? '過去一年' : String(r));
    b.onclick = () => { state.range = r; state.selected = null; render(); };
    return b;
  }));
}

document.getElementById('clear').onclick = () => { state.store = null; render(); };

// 方向鍵移動選取的格子（上下 = 前後一天，左右 = 前後一週），同 Mac 版
document.addEventListener('keydown', e => {
  const step = { ArrowUp: -1, ArrowDown: 1, ArrowLeft: -7, ArrowRight: 7 }[e.key];
  if (!step) return;
  const p = period(state.range);
  let d;
  if (state.selected) { const [y, m, dd] = state.selected.split('-').map(Number); d = addDays(new Date(y, m - 1, dd), step); }
  else d = p.last;
  if (d < p.first || d > p.last) return;
  e.preventDefault();
  state.selected = key(d);
  render();
});

render();
</script>
</body>
</html>
